<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Khuyến Mãi - Admin</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../../../assets/css/shared.css" />
    <link rel="stylesheet" href="../../admin/dashboard/dashboard.css" />
    <link rel="stylesheet" href="../bookings/bookings.css" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <style>
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); z-index: 200; align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: var(--col-surface); width: 500px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--col-border);}
        .modal-header { padding: 18px 20px; background: var(--col-surface-2); border-bottom: 1px solid var(--col-border); display: flex; justify-content: space-between; align-items: center;}
        .modal-header h3 { font-size: 16px; margin: 0; color: var(--col-text); }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--col-border); background: var(--col-surface-2); text-align: right; display: flex; justify-content: flex-end; gap: 10px;}
        .td-actions { display: flex; gap: 8px; }

        .form-group { margin-bottom: 16px; }
        .form-group-row { display: flex; gap: 15px; }
        .flex-1 { flex: 1; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--col-subtext); font-weight: 500; }
        .form-control { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--col-border); 
            border-radius: var(--radius-sm); box-sizing: border-box;
            background: var(--col-bg); color: var(--col-text);
            color-scheme: dark;
        }
        .form-control:focus { outline: none; border-color: var(--col-primary); }
        .form-control option { background: var(--col-bg); color: var(--col-text); }
        .btn-icon { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--col-subtext); transition: var(--transition); }
        .btn-icon:hover { color: var(--col-danger); }
    </style>
</head>
<body>
    <div class="layout" id="layout">
        <!-- SIDEBAR -->
        <div id="sidebar-container" data-active="promotions"></div>

        <!-- MAIN CONTENT -->
        <div class="main">
            <!-- TOP HEADER -->
            <header class="header">
                <button class="header-toggle" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="promoSearch" placeholder="Tìm kiếm mã khuyến mãi..." oninput="filterPromos()" />
                </div>
                <div class="header-actions">
                    <div class="header-user">
                        <div class="avatar avatar-sm" style="background:linear-gradient(135deg,#4f6ef7,#a855f7)">A</div>
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <div class="page-title">
                        <h1>Quản lý Khuyến Mãi</h1>
                        <p>Tạo và quản lý các chiến dịch mã giảm giá (Promotions).</p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-primary" onclick="openPromoModal('create')">
                            <i class="fa-solid fa-plus"></i> Tạo Mã Khuyến Mãi Mới
                        </button>
                    </div>
                </div>

                <!-- FILTER BAR -->
                <div class="card" style="margin-bottom: 20px; padding: 15px;">
                    <div class="filters-bar" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <select id="filterStatus" class="form-control" style="padding: 8px;" onchange="filterPromos()">
                                <option value="all">Tất cả Trạng thái</option>
                                <option value="Đang chạy">Đang chạy</option>
                                <option value="Đã hết hạn">Đã hết hạn</option>
                                <option value="Đã khóa">Đã khóa</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <select id="filterCourt" class="form-control" style="padding: 8px;" onchange="filterPromos()">
                                <option value="all">Tất cả loại sân áp dụng</option>
                                <option value="badminton">Cầu lông</option>
                                <option value="tennis">Tennis</option>
                            </select>
                        </div>
                        <button class="btn btn-secondary" onclick="resetPromoFilters()" style="margin-left: auto; color: white;">
                            <i class="fa-solid fa-rotate-right"></i> Làm mới
                        </button>
                    </div>
                </div>

                <div class="card p-0">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Mã Code</th>
                                    <th>Mức giảm</th>
                                    <th>Giới hạn & Đã dùng</th>
                                    <th>Thời hạn</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="promoTableBody">
                                <!-- JS Render -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Tạo Khuyến mãi -->
    <div class="modal" id="promoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tạo Mã Khuyến Mãi Mới</h3>
                <button class="btn-icon" onclick="closePromoModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="promoForm">
                    <div class="form-group">
                        <label>Mã Code (Ví dụ: CHAOHE2026)</label>
                        <input type="text" id="promoCode" class="form-control" required style="text-transform: uppercase;">
                    </div>
                    <div class="form-group-row flex-gap">
                        <div class="form-group flex-1">
                            <label>Kiểu giảm</label>
                            <select id="promoType" class="form-control">
                                <option value="percentage">% (Phần trăm)</option>
                                <option value="fixed">VNĐ (Tiền mặt)</option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label>Mức giảm</label>
                            <input type="number" id="promoValue" class="form-control" value="10" required>
                        </div>
                    </div>
                    <div class="form-group-row flex-gap">
                        <div class="form-group flex-1">
                            <label>Số lượng giới hạn</label>
                            <input type="number" id="promoLimit" class="form-control" value="100">
                        </div>
                        <div class="form-group flex-1">
                            <label>Hạn sử dụng</label>
                            <input type="date" id="promoExpiry" class="form-control" value="2026-12-31">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Trạng thái</label>
                        <select id="promoStatus" class="form-control">
                            <option value="Đang chạy">Đang chạy (Active)</option>
                            <option value="Đã khóa">Tạm khóa (Inactive)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePromoModal()" style="color: white;">Hủy</button>
                <button class="btn btn-primary" onclick="savePromo()">Lưu Khuyến Mãi</button>
            </div>
        </div>
    </div>

    <!-- Script Menu Toggle & Logic -->
    <script src="promotions.js"></script>
<script src="../../../assets/js/components/sidebar.js"></script>
</body>
</html>
